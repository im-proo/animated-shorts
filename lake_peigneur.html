<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Day a Drill Ate a Lake — 2D Animated Short</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1117;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      overflow-x: hidden;
    }
    .header {
      text-align: center;
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #f3f4f6;
    }
    .header p {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 2px;
    }
    .player-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.1);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    .controls {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 360px;
      margin-top: 14px;
      gap: 10px;
    }
    .btn-row {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 14px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-record {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    }
    .btn-record:active { transform: scale(0.97); }
    .btn-preview {
      background: #27272a;
      color: #e4e4e7;
      border: 1px solid #3f3f46;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: #27272a;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      transition: width 0.1s linear;
    }
    .status-text {
      font-size: 0.8rem;
      color: #9ca3af;
      text-align: center;
      min-height: 20px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="badge">1080x1920 FULL HD • 60 FPS</div>
    <h1>The Day a Drill Ate a Lake</h1>
    <p>Lake Peigneur 1980 • Procedural 2D/3D Animation</p>
  </div>

  <div class="player-container">
    <canvas id="stage" width="1080" height="1920"></canvas>
  </div>

  <div class="controls">
    <div class="progress-bar-wrap">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="status-text" id="statusText">Ready to play or record</div>
    <div class="btn-row">
      <button class="btn-record" id="recordBtn">
        <span>⏺️</span> Record & Save MP4
      </button>
      <button class="btn-preview" id="playBtn">
        <span>▶️</span> Preview
      </button>
    </div>
  </div>

<script>
(function() {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const progressFill = document.getElementById('progressFill');
  const statusText = document.getElementById('statusText');
  const recordBtn = document.getElementById('recordBtn');
  const playBtn = document.getElementById('playBtn');

  const TOTAL_DURATION = 62; // 62 seconds
  const FPS = 30;
  const TOTAL_FRAMES = TOTAL_DURATION * FPS;

  let currentFrame = 0;
  let isPlaying = false;
  let isRecording = false;
  let animationId = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let audioCtx = null;
  let dest = null;

  // ---------------- SOUND SYNTHESIZER (Web Audio API) ----------------
  function initAudio() {
    if (audioCtx) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
    dest = audioCtx.createMediaStreamDestination();
  }

  function playTone(freq, type, dur, gainVal, startOffset = 0) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + startOffset);
      gain.gain.setValueAtTime(gainVal, audioCtx.currentTime + startOffset);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + startOffset + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      if (dest) gain.connect(dest);
      osc.start(audioCtx.currentTime + startOffset);
      osc.stop(audioCtx.currentTime + startOffset + dur);
    } catch(e) {}
  }

  function playNoise(dur, gainVal, startOffset = 0) {
    if (!audioCtx) return;
    try {
      const bufferSize = audioCtx.sampleRate * dur;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(800, audioCtx.currentTime + startOffset);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(gainVal, audioCtx.currentTime + startOffset);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + startOffset + dur);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      if (dest) gain.connect(dest);
      noise.start(audioCtx.currentTime + startOffset);
    } catch(e) {}
  }

  // Periodic March & SFX Trigger
  function triggerSoundForFrame(f) {
    const sec = f / FPS;
    // March beat every 0.5s
    if (f % 15 === 0) {
      if (sec < 28 || sec > 48) {
        // Kick
        if (f % 30 === 0) playTone(95, 'triangle', 0.2, 0.4);
        // Snare
        else playNoise(0.12, 0.15);
        // Bassline
        const notes = [130, 146, 164, 174, 196];
        const note = notes[Math.floor(sec) % notes.length];
        playTone(note, 'sine', 0.25, 0.2);
      }
    }

    // Specific Story SFX Cues
    if (f === 5) playTone(880, 'square', 0.3, 0.25); // Whistle intro
    if (f === 18 * FPS) playTone(440, 'sawtooth', 0.6, 0.3); // Drill puncture!
    if (f === 28 * FPS) playNoise(2.5, 0.6); // Whirlpool begins!
    if (f === 33 * FPS) { // Rig snaps & crashes!
      playTone(60, 'sawtooth', 1.2, 0.8);
      playNoise(1.5, 0.8);
    }
    if (f === 43 * FPS) playTone(300, 'sine', 0.4, 0.4); // Deadpan blink
    if (f === 47 * FPS) playNoise(3.0, 0.7); // Waterfall roar!
    if (f === 58 * FPS) { // Comedic cork POP!
      playTone(1200, 'sine', 0.15, 0.8);
      playTone(1800, 'sine', 0.25, 0.5, 0.05);
    }
  }

  // ---------------- CHARACTER & TOON DRAWING API ----------------
  function drawBeanHead(x, y, w, h, angle = 0, expression = 'smile') {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    // Plum Ink outline
    ctx.fillStyle = '#fce7d2';
    ctx.strokeStyle = '#241726';
    ctx.lineWidth = 12;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // Bean shape
    ctx.beginPath();
    ctx.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Eyes
    ctx.fillStyle = '#241726';
    const eyeDist = w * 0.26;
    const eyeY = -h * 0.08;

    if (expression === 'blink') {
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(-eyeDist - 12, eyeY); ctx.lineTo(-eyeDist + 12, eyeY);
      ctx.moveTo(eyeDist - 12, eyeY); ctx.lineTo(eyeDist + 12, eyeY);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(-eyeDist, eyeY, 10, 0, Math.PI * 2);
      ctx.arc(eyeDist, eyeY, 10, 0, Math.PI * 2);
      ctx.fill();
    }

    // Mouth
    ctx.lineWidth = 8;
    ctx.beginPath();
    if (expression === 'smile') {
      ctx.arc(0, h * 0.18, 22, 0.1 * Math.PI, 0.9 * Math.PI);
    } else if (expression === 'shock') {
      ctx.ellipse(0, h * 0.2, 16, 24, 0, 0, Math.PI * 2);
    } else if (expression === 'deadpan') {
      ctx.moveTo(-20, h * 0.2); ctx.lineTo(20, h * 0.2);
    }
    ctx.stroke();

    ctx.restore();
  }

  function drawCharacter(x, y, scale = 1, expression = 'smile', walkCycle = 0, hatType = 'none') {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    const bob = Math.sin(walkCycle) * 12;

    // Legs
    ctx.strokeStyle = '#241726';
    ctx.lineWidth = 14;
    ctx.lineCap = 'round';
    const legSwing = Math.sin(walkCycle) * 35;
    ctx.beginPath();
    ctx.moveTo(-30, 200); ctx.lineTo(-30 - legSwing, 330);
    ctx.moveTo(30, 200); ctx.lineTo(30 + legSwing, 330);
    ctx.stroke();

    // Body
    ctx.fillStyle = '#3b82f6';
    ctx.beginPath();
    ctx.roundRect(-45, 60 + bob, 90, 150, 30);
    ctx.fill();
    ctx.stroke();

    // Arms
    ctx.beginPath();
    ctx.moveTo(-50, 90 + bob); ctx.lineTo(-80, 180 + bob - legSwing * 0.8);
    ctx.moveTo(50, 90 + bob); ctx.lineTo(80, 180 + bob + legSwing * 0.8);
    ctx.stroke();

    // Hands
    ctx.fillStyle = '#fce7d2';
    ctx.beginPath();
    ctx.arc(-80, 180 + bob - legSwing * 0.8, 14, 0, Math.PI * 2);
    ctx.arc(80, 180 + bob + legSwing * 0.8, 14, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    // Head
    drawBeanHead(0, -30 + bob, 150, 160, Math.sin(walkCycle * 0.5) * 0.05, expression);

    // Hat
    if (hatType === 'straw') {
      ctx.fillStyle = '#eab308';
      ctx.strokeStyle = '#241726';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.ellipse(0, -95 + bob, 120, 25, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, -105 + bob, 50, Math.PI, 0);
      ctx.fill(); ctx.stroke();
    } else if (hatType === 'miner') {
      ctx.fillStyle = '#facc15';
      ctx.strokeStyle = '#241726';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.arc(0, -85 + bob, 65, Math.PI, 0);
      ctx.fill(); ctx.stroke();
      // Lamp
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(0, -95 + bob, 15, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }

    ctx.restore();
  }

  // ---------------- SCENE RENDERER ----------------
  function renderFrame(f) {
    const sec = f / FPS;
    ctx.clearRect(0, 0, 1080, 1920);

    // 1. SKY & BACKGROUND
    const skyGrad = ctx.createLinearGradient(0, 0, 0, 1200);
    skyGrad.addColorStop(0, '#3e7fd2');
    skyGrad.addColorStop(0.7, '#88b5ea');
    skyGrad.addColorStop(1, '#d5e4f7');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, 1080, 1920);

    // Sun with soft halo
    ctx.fillStyle = 'rgba(255, 255, 230, 0.9)';
    ctx.beginPath();
    ctx.arc(850, 280, 90, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255, 245, 200, 0.2)';
    ctx.beginPath();
    ctx.arc(850, 280, 220, 0, Math.PI * 2);
    ctx.fill();

    // Clouds
    ctx.fillStyle = '#ffffff';
    [-200, 400, 900].forEach((cx, idx) => {
      const ox = (cx + f * 0.6) % 1400 - 200;
      ctx.beginPath();
      ctx.arc(ox, 350 + idx * 80, 70, 0, Math.PI * 2);
      ctx.arc(ox + 60, 320 + idx * 80, 90, 0, Math.PI * 2);
      ctx.arc(ox + 130, 350 + idx * 80, 65, 0, Math.PI * 2);
      ctx.fill();
    });

    // ================= SCENE BEATS =================
    if (sec < 8) {
      // SCENE 1: The Hook & Peaceful Lake
      // Lake Water
      ctx.fillStyle = '#2563eb';
      ctx.fillRect(0, 1150, 1080, 770);
      // Gentle waves
      ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 6;
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        const wy = 1250 + i * 90;
        ctx.moveTo(0, wy + Math.sin(f * 0.08 + i) * 12);
        ctx.bezierCurveTo(360, wy - 15, 720, wy + 15, 1080, wy);
        ctx.stroke();
      }

      // Distant drilling rig
      ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.moveTo(750, 1150); ctx.lineTo(820, 850); ctx.lineTo(890, 1150);
      ctx.stroke();
      ctx.fillStyle = '#e2e8f0'; ctx.fillRect(800, 840, 40, 20);

      // Fisherman in wooden boat
      const boatX = 350 + Math.sin(f * 0.05) * 20;
      const boatY = 1350 + Math.sin(f * 0.08) * 15;
      ctx.fillStyle = '#78350f'; ctx.strokeStyle = '#241726'; ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(boatX - 180, boatY);
      ctx.bezierCurveTo(boatX - 100, boatY + 90, boatX + 100, boatY + 90, boatX + 180, boatY);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // Fishing rod
      ctx.strokeStyle = '#1c1917'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(boatX + 20, boatY - 50); ctx.lineTo(boatX + 260, boatY - 180); ctx.stroke();
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(boatX + 260, boatY - 180); ctx.lineTo(boatX + 260, boatY + 100); ctx.stroke();

      // Bass Fisherman Character
      drawCharacter(boatX - 20, boatY - 140, 0.7, (f % 45 < 4) ? 'blink' : 'smile', f * 0.05, 'straw');

      // Caption card
      drawSubtitle("A tiny 14-inch drill bit accidentally drained an entire lake...");

    } else if (sec < 20) {
      // SCENE 2: Split Screen — Surface vs 1,300ft Salt Cavern
      // Surface (Top half)
      ctx.fillStyle = '#2563eb';
      ctx.fillRect(0, 550, 1080, 350);

      // Oil platform on surface
      ctx.fillStyle = '#64748b'; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 10;
      ctx.fillRect(360, 480, 360, 50); ctx.strokeRect(360, 480, 360, 50);
      // Derrick
      ctx.beginPath();
      ctx.moveTo(420, 480); ctx.lineTo(540, 180); ctx.lineTo(660, 480);
      ctx.stroke();

      // Drill pipe going down
      const drillSpin = (f * 25) % 40;
      ctx.strokeStyle = '#334155'; ctx.lineWidth = 18;
      ctx.beginPath(); ctx.moveTo(540, 180); ctx.lineTo(540, 1200); ctx.stroke();

      // Earth / Bedrock layer
      ctx.fillStyle = '#451a03';
      ctx.fillRect(0, 900, 1080, 250);

      // Underground Salt Cavern (Bottom half)
      ctx.fillStyle = '#f8fafc'; // White rock salt walls
      ctx.fillRect(0, 1150, 1080, 770);
      ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 8;
      // Salt pillars
      [150, 540, 920].forEach(px => {
        ctx.fillRect(px - 60, 1150, 120, 770);
        ctx.strokeRect(px - 60, 1150, 120, 770);
      });

      // Drill punching through the ceiling at 18s!
      const drillY = Math.min(1250, 1050 + (sec - 8) * 20);
      ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 22;
      ctx.beginPath(); ctx.moveTo(540, 900); ctx.lineTo(540, drillY); ctx.stroke();

      // Water leak drops
      if (sec > 17) {
        ctx.fillStyle = '#38bdf8';
        for (let i = 0; i < 5; i++) {
          ctx.beginPath();
          ctx.arc(540, drillY + ((f * 15 + i * 50) % 200), 12, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Miner character
      const expr = (sec > 17) ? 'shock' : 'smile';
      drawCharacter(360, 1500, 0.85, expr, f * 0.1, 'miner');

      drawSubtitle(sec > 17 ? "Their 14-inch drill punches right through the roof of the salt mine..." : "1,300 feet directly below, miners work in a solid salt mine.");

    } else if (sec < 34) {
      // SCENE 3: The Dissolve & Massive Whirlpool
      // Water vortex
      const whirlAngle = f * 0.15;
      const whirlX = 540;
      const whirlY = 1200;

      ctx.save();
      ctx.translate(whirlX, whirlY);
      // Churning vortex spiral
      for (let r = 500; r > 30; r -= 35) {
        ctx.beginPath();
        ctx.arc(0, 0, r, whirlAngle + r * 0.05, whirlAngle + r * 0.05 + Math.PI * 1.5);
        ctx.strokeStyle = (r % 70 === 0) ? '#1e40af' : '#60a5fa';
        ctx.lineWidth = 20;
        ctx.stroke();
      }
      // Black hole center
      ctx.fillStyle = '#020617';
      ctx.beginPath(); ctx.arc(0, 0, 90, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      // Oil rig tilting and sinking
      const rigTilt = Math.min(0.85, (sec - 24) * 0.1);
      const rigY = 900 + (sec - 24) * 35;
      ctx.save();
      ctx.translate(540, rigY);
      ctx.rotate(rigTilt);
      ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 16;
      ctx.strokeRect(-180, -30, 360, 50);
      ctx.beginPath(); ctx.moveTo(-120, -30); ctx.lineTo(0, -350); ctx.lineTo(120, -30); ctx.stroke();
      ctx.restore();

      drawSubtitle("Fresh water melts salt like sugar in hot coffee. The lake drains into a monster whirlpool!");

    } else if (sec < 46) {
      // SCENE 4: Empty Mud Basin & Deadpan Catfish
      // Dry cracked mud ground
      ctx.fillStyle = '#78350f';
      ctx.fillRect(0, 850, 1080, 1070);

      // Mud cracks
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 8;
      for (let i = 0; i < 8; i++) {
        ctx.beginPath();
        ctx.moveTo(100 + i * 120, 950);
        ctx.lineTo(160 + i * 120, 1150);
        ctx.lineTo(120 + i * 120, 1400);
        ctx.stroke();
      }

      // Mud-covered catfish blinking
      ctx.save();
      ctx.translate(540, 1350);
      ctx.fillStyle = '#a16207'; ctx.strokeStyle = '#241726'; ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.ellipse(0, 0, 140, 70, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      // Whiskers
      ctx.beginPath();
      ctx.moveTo(-120, 10); ctx.lineTo(-180, -20);
      ctx.moveTo(-120, 20); ctx.lineTo(-180, 40);
      ctx.stroke();
      // Eye blink
      const blink = (f % 50 < 6);
      if (blink) {
        ctx.beginPath(); ctx.moveTo(-60, -20); ctx.lineTo(-40, -20); ctx.stroke();
      } else {
        ctx.fillStyle = '#241726';
        ctx.beginPath(); ctx.arc(-50, -20, 12, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();

      drawSubtitle("Luckily, the lake was completely empty. Unluckily, the Gulf of Mexico was not.");

    } else if (sec < 56) {
      // SCENE 5: The Ocean Flows Backwards! Giant 150ft Waterfall
      // Canyon drop
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, 1000, 1080, 920);

      // Roaring Waterfall into crater
      ctx.fillStyle = '#60a5fa';
      ctx.fillRect(200, 700, 680, 900);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 10;
      for (let i = 0; i < 12; i++) {
        const fallY = 700 + ((f * 40 + i * 80) % 900);
        ctx.beginPath();
        ctx.moveTo(240 + i * 50, fallY);
        ctx.lineTo(240 + i * 50, fallY + 60);
        ctx.stroke();
      }

      // Giant water spray at base
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      for (let j = 0; j < 8; j++) {
        ctx.beginPath();
        ctx.arc(280 + j * 75, 1600 + Math.sin(f * 0.2 + j) * 30, 70, 0, Math.PI * 2);
        ctx.fill();
      }

      drawSubtitle("The ocean literally flowed backwards for days, creating a temporary 150-foot waterfall!");

    } else {
      // SCENE 6: Callback Twist — Barges Pop Up Like Rubber Ducks!
      // Calm water
      ctx.fillStyle = '#3b82f6';
      ctx.fillRect(0, 1100, 1080, 820);

      // Water ripple circles
      ctx.strokeStyle = '#93c5fd'; ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(540, 1350, ((f * 5) % 250), 0, Math.PI * 2);
      ctx.stroke();

      // Barge popping up like a giant rubber duck!
      const popProgress = Math.min(1, (sec - 56) * 1.5);
      const popY = 1600 - Math.sin(popProgress * Math.PI * 0.5) * 450 + Math.sin(f * 0.1) * 15;

      ctx.save();
      ctx.translate(540, popY);

      // Yellow Duck Barge
      ctx.fillStyle = '#facc15'; ctx.strokeStyle = '#241726'; ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.roundRect(-220, -50, 440, 140, 40);
      ctx.fill(); ctx.stroke();

      // Duck Head on barge
      ctx.beginPath();
      ctx.arc(140, -100, 75, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      // Bill
      ctx.fillStyle = '#ea580c';
      ctx.beginPath(); ctx.ellipse(220, -90, 45, 25, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // Googly Eye
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(150, -120, 20, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#000000'; ctx.beginPath(); ctx.arc(155, -120, 10, 0, Math.PI * 2); ctx.fill();

      ctx.restore();

      drawSubtitle("Two days later, underground air pressure burped—popping 9 barges back up like rubber ducks!");
    }

    // Progress line at bottom
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(0, 1905, (f / TOTAL_FRAMES) * 1080, 15);
  }

  function drawSubtitle(text) {
    ctx.save();
    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 4;
    ctx.roundRect(80, 1680, 920, 160, 24);
    ctx.fill(); ctx.stroke();

    ctx.font = 'bold 38px -apple-system, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    wrapText(ctx, text, 540, 1760, 840, 48);
    ctx.restore();
  }

  function wrapText(context, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    const lines = [];
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      const metrics = context.measureText(testLine);
      if (metrics.width > maxWidth && n > 0) {
        lines.push(line);
        line = words[n] + ' ';
      } else {
        line = testLine;
      }
    }
    lines.push(line);
    const startY = y - ((lines.length - 1) * lineHeight) / 2;
    for (let k = 0; k < lines.length; k++) {
      context.fillText(lines[k], x, startY + (k * lineHeight));
    }
  }

  // ---------------- ANIMATION & RECORDING LOOP ----------------
  function step() {
    if (!isPlaying && !isRecording) return;
    renderFrame(currentFrame);
    triggerSoundForFrame(currentFrame);

    currentFrame++;
    const progress = (currentFrame / TOTAL_FRAMES) * 100;
    progressFill.style.width = progress + '%';
    statusText.innerText = `${isRecording ? '⏺️ Recording' : '▶️ Previewing'}: ${(currentFrame / FPS).toFixed(1)}s / ${TOTAL_DURATION}s (${progress.toFixed(0)}%)`;

    if (currentFrame >= TOTAL_FRAMES) {
      stopPlayback();
      return;
    }

    animationId = requestAnimationFrame(step);
  }

  function startPreview() {
    stopPlayback();
    initAudio();
    currentFrame = 0;
    isPlaying = true;
    playBtn.innerText = '⏸️ Pause';
    step();
  }

  function stopPlayback() {
    isPlaying = false;
    if (animationId) cancelAnimationFrame(animationId);
    playBtn.innerText = '▶️ Preview';
    if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
  }

  // ---------------- MEDIA RECORDER EXPORT ----------------
  function startRecording() {
    stopPlayback();
    initAudio();
    recordedChunks = [];
    currentFrame = 0;
    isRecording = true;
    recordBtn.disabled = true;
    recordBtn.innerText = 'Recording 60s...';

    // Stream from canvas
    const canvasStream = canvas.captureStream(30);

    // Combine with audio stream
    const combinedTracks = [...canvasStream.getVideoTracks()];
    if (dest && dest.stream) {
      combinedTracks.push(...dest.stream.getAudioTracks());
    }
    const combinedStream = new MediaStream(combinedTracks);

    // Codec support detection
    let mimeType = 'video/mp4;codecs=avc1';
    if (!MediaRecorder.isTypeSupported(mimeType)) {
      mimeType = 'video/webm;codecs=vp9';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
    }

    try {
      mediaRecorder = new MediaRecorder(combinedStream, {
        mimeType: mimeType,
        videoBitsPerSecond: 8000000 // 8 Mbps high quality
      });
    } catch(e) {
      mediaRecorder = new MediaRecorder(combinedStream);
    }

    mediaRecorder.ondataavailable = function(e) {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = function() {
      isRecording = false;
      recordBtn.disabled = false;
      recordBtn.innerHTML = '<span>⏺️</span> Record & Save MP4';
      statusText.innerText = '🎉 Video exported! Downloading...';

      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/mp4' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      const ext = mediaRecorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
      a.download = `lake_peigneur_short.${ext}`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      }, 100);
    };

    mediaRecorder.start(250); // collect chunk every 250ms
    step();
  }

  // Initial first frame render
  renderFrame(0);

  // Event Listeners
  playBtn.addEventListener('click', () => {
    if (isPlaying) stopPlayback();
    else startPreview();
  });

  recordBtn.addEventListener('click', () => {
    startRecording();
  });

})();
</script>
</body>
</html>
